<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" width="100%" height="100%">
  <defs>
    <!-- Dark metallic gradient for the primary faces -->
    <linearGradient id="mainLeft" x1="0.8" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="40%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="mainRight" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="40%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Lighter metallic gradient for the outer bevels -->
    <linearGradient id="bevelLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b0b0b0" />
      <stop offset="100%" stop-color="#4a4a4a" />
    </linearGradient>
    <linearGradient id="bevelRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0b0b0" />
      <stop offset="100%" stop-color="#4a4a4a" />
    </linearGradient>
  </defs>

  <style>
    /* Time Vault Float and Glow Animation */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }
    @keyframes pulse-glow {
      0% { filter: drop-shadow(0 0 1px rgba(0,0,0,0.3)); }
      50% { filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.6)); }
      100% { filter: drop-shadow(0 0 1px rgba(0,0,0,0.3)); }
    }
    .vault {
      animation: float 6s ease-in-out infinite, pulse-glow 4s ease-in-out infinite;
      transform-origin: center;
    }
    .shard {
      transition: transform 0.3s ease;
    }
    /* Subtle interaction: Shards pull slightly apart on hover */
    .vault:hover .shard-left {
      transform: translateX(-1px);
    }
    .vault:hover .shard-right {
      transform: translateX(1px);
    }
  </style>

  <g class="vault">
    <!-- Left Shard -->
    <g class="shard shard-left">
      <!-- Main Face -->
      <polygon points="49,10 30,150 49,190" fill="url(#mainLeft)"/>
      <!-- Top Bevel -->
      <polygon points="49,10 24,145 30,150" fill="url(#bevelLeft)"/>
      <!-- Bottom Bevel -->
      <polygon points="30,150 24,145 49,190" fill="url(#bevelLeft)"/>
    </g>

    <!-- Right Shard -->
    <g class="shard shard-right">
      <!-- Main Face -->
      <polygon points="51,10 70,150 51,190" fill="url(#mainRight)"/>
      <!-- Top Bevel -->
      <polygon points="51,10 76,145 70,150" fill="url(#bevelRight)"/>
      <!-- Bottom Bevel -->
      <polygon points="70,150 76,145 51,190" fill="url(#bevelRight)"/>
    </g>
  </g>
</svg>
